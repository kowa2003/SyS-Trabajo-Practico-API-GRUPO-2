name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar uv y Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias (incluye el grupo dev)
        working-directory: ./rir_api
        run: uv sync

      - name: Linter (ruff check)
        working-directory: ./rir_api
        run: uvx ruff check app/ tests/

      - name: Formato (ruff format --check)
        working-directory: ./rir_api
        run: uvx ruff format --check app/ tests/

      - name: Tests (pytest + cobertura)
        working-directory: ./rir_api
        run: uv run pytest -q --cov=app